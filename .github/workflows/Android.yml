name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find gradlew and Build APK
        run: |
          # リポジトリ全体から gradlew を自動検索
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found."
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          
          # 実行権限の付与
          chmod +x "$GRADLEW_PATH"
          
          # 該当フォルダへ移動してビルド実行
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          cd "$BUILD_DIR"
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-agent-debug-apk
          path: "**/app-debug.apk"
