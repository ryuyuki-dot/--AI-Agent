name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find Project and Build APK
        run: |
          # build.gradle があるプロジェクトフォルダを自動検索
          BUILD_FILE=$(find . \( -name "build.gradle" -o -name "build.gradle.kts" \) | grep -v "/app/" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            # rootに直接 app フォルダがある場合
            BUILD_FILE=$(find . \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # gradlew があれば実行、なければシステム標準の gradle を使用
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found. Running system gradle command..."
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-agent-debug-apk
          path: "**/app-debug.apk"
