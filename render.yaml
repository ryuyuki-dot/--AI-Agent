services:
  - type: web
    name: personal-ai-agent-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # Renderの管理画面から手動で値を入力する（コードには書かない）
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
